<svg fill="none" viewBox="0 0 800 250" width="800" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;family=Inter:wght@400;600;800&amp;display=swap');
      .bg { fill: #0d1117; }
      .border { stroke: #30363d; stroke-width: 1.5; }
      .title { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 24px; fill: #c9d1d9; letter-spacing: 2px; }
      .subtitle { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; fill: #8b949e; letter-spacing: 2px; }
      .terminal-bg { fill: #161b22; }
      .terminal-border { stroke: #21262d; stroke-width: 1; }
      .code { font-family: 'Fira Code', monospace; font-size: 14px; fill: #79c0ff; }
      .code-white { fill: #c9d1d9; }
      .code-green { fill: #7ee787; }
      .code-purple { fill: #d2a8ff; }
      .pulse { animation: blink 2s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="796" height="246" x="2" y="2" rx="15" class="bg border" />
  
  <!-- Glowing Orb -->
  <circle cx="730" cy="50" r="20" fill="#79c0ff" opacity="0.1" filter="url(#glow)" class="pulse" />
  <circle cx="730" cy="50" r="6" fill="#79c0ff" class="pulse" />

  <!-- Headers -->
  <text x="40" y="55" class="title">AETHER LOG</text>
  <text x="40" y="80" class="subtitle">NIGHTLY SYSTEMS ANALYSIS</text>
  <text x="700" y="55" class="subtitle" text-anchor="end">{{DATE}}</text>

  <!-- Terminal Window -->
  <rect width="720" height="130" x="40" y="95" rx="8" class="terminal-bg terminal-border" />
  
  <!-- Terminal Buttons -->
  <circle cx="55" cy="115" r="5" fill="#ff5f56" />
  <circle cx="75" cy="115" r="5" fill="#ffbd2e" />
  <circle cx="95" cy="115" r="5" fill="#27c93f" />
  
  <!-- Terminal Content -->
  <text x="55" y="155" class="code code-purple">❯</text>
  <text x="75" y="155" class="code code-white">Target repository acquired:</text>
  <text x="290" y="155" class="code">{{PROJECT}}</text>
  
  <text x="55" y="185" class="code code-purple">❯</text>
  <text x="75" y="185" class="code code-white">Decrypting latest transmission...</text>
  
  <text x="55" y="210" class="code code-green">"{{COMMIT}}"</text>
</svg>
