name: Aether Daily Design Rotation

on:
  schedule:
    # Runs at 13:00 UTC = 20:00 WIB (8 PM Jakarta time)
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  rotate-theme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Themed Profile
        run: node generate_profile.js

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Aether Design Academy"
          git add .
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "🎨 design(aether): daily profile theme rotation" && \
            git push
          )
