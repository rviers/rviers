name: Aether Nightly Update

on:
  schedule:
    # Runs at 13:00 UTC, which is 20:00 (8 PM) WIB (UTC+7)
    - cron: '0 13 * * *' 
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  update-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the updated SVG

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Aether Script
        run: npm start

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Aether Assistant"
          git add aether-status.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: nightly aether log update" && git push)
